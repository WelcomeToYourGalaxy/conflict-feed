.cf-trlabel { font-size: 0.53rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); }
.cf-tr select { font-family: inherit; font-size: 0.62rem; color: var(--ink);

.cf-mt { color: var(--ink-faint); border: 1px solid var(--line-soft); border-radius: 999px;
    padding: 0.02rem 0.38rem; letter-spacing: 0.1em; }

    border-top: 1px solid var(--line-soft); display: flex; align-items: center; gap: 0.5rem; }

   pieces take shares of it and the list scrolls inside — nothing lands below
   the fold. In FLOW mode there is no definite height to take a share of, so
   the map gets real pixels and the page scrolls. */

 }

.cf-sheet { position: absolute; left: clamp(0.7rem, 2vw, 1.4rem); right: clamp(0.7rem, 2vw, 1.4rem); bottom: 2.6rem; z-index: 30; max-height: 66%; overflow-y: auto; display: none; border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem 1rem; background: rgba(10,15,28,0.96); backdrop-filter: blur(10px); box-shadow: 0 24px 60px rgba(0,0,0,0.55); }

.cf-foot { flex: 0 0 auto; max-width: 1320px; width: 100%; margin: 0 auto; padding-top: 0.4rem; border-top: 1px solid var(--line-soft); font-size: 0.57rem; color: var(--ink-faint); line-height: 1.4; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

.cf-tab { font-family: inherit; font-size: 0.58rem; letter-spacing: 0.08em; color: var(--ink-dim); background: rgba(255,255,255,0.04); border: 1px solid var(--line-soft); border-radius: 999px; padding: 0.2rem 0.6rem; cursor: pointer; }

/* No flow mode. The feed always has a definite height and scrolls inside
   itself — on a phone as much as in a sidebar. It never grows to its content
   and never asks the page around it to resize, because a frame sized from
   content that is itself sized from the frame can run away in either

@media (max-width: 900px) {

}

}

/* A point inferred from the reporting country rather than read out of
   the story is drawn hollow, so the map never claims to know more than
   it does. */
.cf-pin-approx { background: transparent !important;
    box-shadow: inset 0 0 0 1.5px currentColor; }

<div class="cf">

            <div class="cf-row" id="cfWhenRow"><span class="cf-key">Window</span></div>

                    <p class="cf-gm-wait" id="cfGmWait">Loading guerillamap…</p>
                    <iframe class="cf-gm-frame" id="cfGmFrame" title="Guerillamap conflict and geopolitical overlays"
                            allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    <p class="cf-gm-cred">Overlays and data: <a href="https://guerillamap.com/" target="_blank" rel="noopener">guerillamap.com</a> ·
                        third-party sources under their own terms</p>
                </div>
            </div>
        </div>
    </section>

    <div class="cf-sheet" id="cfSheetAbout" role="dialog" aria-label="How this feed works">
        <button class="cf-sheet-close" data-close aria-label="Close">×</button>
        <p class="cf-note">
            <strong>What this is.</strong> A monitor of armed conflict and the machinery around it: offensives
            and incursions, strikes and bombardment, attacks on civilians, the arms industry and its contracts,
            budgets and military aid, bases and deployments, officials and command, law and accountability,
            nuclear and strategic forces, humanitarian consequence, and cyber and information operations.
        </p>
        <p class="cf-note">
            <strong>It does not take a side, and it does not summarise.</strong> Headlines and snippets are the
            publishers' own, truncated but never reworded; no claim is assessed, no party is described, and no
            model touches the text. Every row links to the original. On a subject where the same event is
            reported irreconcilably from opposite directions, the honest thing a feed can do is show who
            published what and let you read them against each other — which is what the source labels are for.
        </p>
        <p class="cf-note">
            <strong>Direction.</strong> Escalation — offensives launched, strikes carried out, weapons
            delivered, budgets raised, forces deployed, talks abandoned. De-escalation — ceasefires, truces,
            withdrawals, prisoner exchanges, aid corridors opened, treaties signed, sanctions lifted. Feeds of
            this subject overwhelmingly show the first; the second is marked so it can be found. A story can
            carry both, and often does: a ceasefire announced after a night of strikes.
        </p>
        <p class="cf-note">
            <strong>Who reports it.</strong> <em>Bodies, courts &amp; ministries</em> is UN mechanisms, the ICRC,
            NATO, courts and defence ministries — parties as well as arbiters, and labelled so you know which.
            <em>Research &amp; monitors</em> is SIPRI, ACLED, Human Rights Watch, Amnesty, Bellingcat, Airwars.
            <em>Defence trade press</em> covers the industry from inside it. <em>Press</em> is general news across
            25 languages, including outlets on several sides of ongoing wars.
        </p>
        <p class="cf-note">
            <strong>Evidence.</strong> Each story is scored on what it carries: a documented act — confirmed,
            announced, signed, carried out, a verdict, a warrant (2); institutional material — a UN body, a
            court, a ministry, SIPRI, ACLED, satellite imagery, a commission of inquiry (2); a measured figure
            (1); a scheduled or pending step (1); a named place (1); and a primary source (1). At three or more
            the row is marked well documented. A score is not a judgement of truth — an official statement scores
            well and can still be false. It records what kind of thing the story is.
        </p>
        <p class="cf-note">
            <strong>The map.</strong> Two layers. Wide out you are looking at a painted plate — a drawn chart
            of the world, carried over from the projects map. Zoom past it and the plate cross-fades away
            between zoom 3 and zoom 5.6 to satellite imagery from Esri's free World Imagery layer: no account, no
            key, nothing tracked beyond the tiles your browser requests. The imagery carries the same treatment
            as the projects map — it supplies the light, a sea screen and a green soft-light wash shift the
            colour, a warm overlay does the sunlight, and an Esri hillshade multiplied on top puts the relief
            back. The tints ease off as you zoom in, where they would cover the detail you zoomed in for, and the
            relief strengthens, where it is wanted. In the far south the chart thins out through the forties rather than
            ending on a line, so it hands over to the ice gradually. No place labels: the ground is left to
            read as ground, and the pins carry the names. Every coastline on screen is still Esri's — nothing is redrawn, only lit
            differently. If the hillshade fails to load it is dropped and the plain imagery stands.
        </p>
        <p class="cf-note">
            <strong>Guerillamap overlays.</strong> The panel under the map is guerillamap.com in a frame,
            open by default, with the conflict, news, losses, minefield, nuclear-test, terror, migration and
            border layers switched on. It is their live map, not a copy of their data: a page cannot read
            across into another site's frame, so nothing is extracted here and nothing goes stale behind them.
            What it can do is follow — their app takes its whole state from its address, so the frame is
            rebuilt to whatever this map is looking at, a moment after you stop moving. Their view sits a
            little south of this one, by a share of their frame height rather than a fixed number of degrees,
            because their panel is shorter and wider than this map. Untick "follow this map" to hold their view
            while this one carries on, and use the button on the status strip to close the panel. Their terms
            allow the use with attribution; the credit line under the panel is that attribution.
        </p>
        <p class="cf-note">
            <strong>In a narrow frame.</strong> Below 1200px the map and the overlays move under the list
            instead of beside it — 1200 rather than 900 because a half-width column on a wide theme is often
            800 to 1000px, which clears a 900px breakpoint and stays side by side. Stacked, the list takes
            about a third and scrolls on its own; the map and the overlays split the rest and are both fully
            visible. The frame itself is a fixed height set in the embed tag, so nothing measures anything and
            nothing resizes: every self-sizing version of this wandered, upward or downward, until the content
            was gone.
        </p>
        <p class="cf-note">
            <strong>Where the pins come from.</strong> Nothing is geocoded by a service: a story is placed by the
            names it contains, matched against a gazetteer of countries, cities, provinces, bases and waterways
            written out in twenty-odd languages — 基輔, Kiew, キーウ and Kyiv all land on the same point. Where two
            countries are named, the one carrying a locative marker wins: <em>Krieg im Libanon … israelischem
            Luftangriff</em> pins on Lebanon, not on Israel, because <em>im</em> marks the scene and the other is
            the actor. A story naming a town is pinned on the town; one naming only a country sits at that
            country's centre, which is a weaker claim and counted separately in the line under the status; one
            naming nowhere is not mapped at all. Around one story in seven still names no place — a contract
            award, a doctrine piece — and no guess is made for it. Every story that resolved to a place
            gets its own pin. Stories resolving to the same place would sit on top of each other, so each is
            nudged out along a phyllotaxis spiral — the arrangement seeds take on a sunflower head, which shows
            neither rings nor spokes — with a jitter drawn from each story's own address, so a crowded city
            reads as scattered rather than drawn and a pin keeps its place from one render to the next. The
            nudge is measured in screen pixels, so it shrinks on the ground as you zoom in and the pins
            converge on their true coordinates; below zoom 5 it is held to a couple of pixels and a crowded
            city collapses to a single dot rather than a spray. Clicking
            any pin opens a box listing every story within a few pixels of it — the one you clicked first, then
            its neighbours, each with its source and, where they differ, its own place. Zoomed out, that means
            Gaza and Rafah open together because they genuinely overlap; zoomed in they separate and each opens
            alone. Every title in the box links to its publisher exactly as a row does. The pins are built from the same
            filtered set as the list, so every toggle above applies to both. Stories that named nowhere in
            particular are counted as unplaced under the map rather than guessed at and dropped somewhere false.
        </p>
        <p class="cf-note">
            <strong>How precise a pin is.</strong> The harvester looks for a named place first: a city,
            province, base, island or waterway — Kharkiv, Rafah, El Fasher, Goma, Ramstein, Al Udeid, Bab
            el-Mandeb, the Taiwan Strait. Roughly 260 of those are known, and a city beats the province
            containing it, so "M23 advances on Goma in North Kivu" pins Goma rather than the province. Only when
            no such place is named does the pin fall back to a country centroid, then a subregion, then a region.
            The row and the popup both name whichever level was used, so you can always see how precise a given
            pin is. A country-level pin is not the location of an event, and the small offset that keeps
            neighbouring pins apart is not a location either. A story
            about a strike in eastern Ukraine sits at the middle of Ukraine, because the feed reads headlines, not
            coordinates. Treat the map as a locator for what is being covered where, not as a map of events.
        </p>
        <p class="cf-note">
            <strong>Region.</strong> Placement runs three levels deep: pick a region, then a subregion, then a
            place. Each row counts what it holds, and a story files under everything above whatever place it
            names. Choosing any of the three moves the map to frame that geography in full — Europe fits Europe,
            the Levant fits the Levant, Sweden centres on Sweden — and clearing returns it to the world. The
            frame comes from the gazetteer rather than from where the stories happen to be, so a region with two
            stories still shows you the whole region. Subject, direction, evidence and language filters leave the
            view alone, and so does panning: the map only moves when you ask it to move.
        </p>
        <p class="cf-note">
            <strong>What is refused.</strong> The metaphors, which are relentless in this vocabulary: price wars,
            bidding wars, culture wars, wars of words, battles for market share, battleground states. Sport,
            where attacks and battles are constant. The shooter franchises. The status line reports how many
            stories each harvest refused.
        </p>
        <p class="cf-note">
            <strong>Why some stories are not mapped.</strong> A story is placed only if its headline or snippet
            names somewhere the gazetteer or the place table knows. Two things keep that number down. Headlines often name no place
            at all — "defence budget raised", "arms exports approved" — and those are genuinely unplaceable.
            And the gazetteer only knows the places written into it: it carries 217 entries, including capitals
            and demonyms, because headlines say Kyiv, Pentagon and Israeli far more often than they say the
            country. Anything it does not carry falls to unplaced. The list is in <code>ADDITIONS</code> and
            <code>TERM_EXTRAS</code> at the top of <code>harvest_conflict.py</code> and is meant to grow — adding
            a city, a force name or an armed group is one line, and the next harvest maps everything that names
            it.
        </p>
        <p class="cf-note">
            <strong>Limits worth knowing.</strong> The gate is mechanical: it reads words, not meaning. Casualty
            figures in headlines are claims by whoever supplied them, and this feed neither verifies nor
            reconciles them. Coverage of any given war is uneven and partisan by language, and the language
            counts show the shape of that rather than correcting it. Google News caps a query at roughly 100
            results over about 45 days.
        </p>
    </div>

    <div class="cf-sheet" id="cfSheetSources" role="dialog" aria-label="Sources and coverage">
        <button class="cf-sheet-close" data-close aria-label="Close">×</button>
        <p class="cf-note">
            Every wire read on the last harvest, with its standing: what it returned, and how many of its
            stories were refused or dropped as too local. A wire that could not be reached says so rather than
            disappearing.
        </p>
        <div class="cf-src-grid" id="cfSrcGrid"></div>
    </div>

    <footer class="cf-foot">
        <span>Harvested every two hours from UN mechanisms and courts, conflict monitors and rights researchers, defence trade press, regional editions in 25 languages, and dedicated event searches. Headlines belong to their publishers.</span>
        <span class="cf-foot-tools">
            <button class="cf-tab" data-sheet="cfSheetAbout">How this works</button>
            <button class="cf-tab" data-sheet="cfSheetSources">Sources &amp; coverage</button>
        </span>
    </footer>
</div>

<script>
(function () {
'use strict';

const REPO = 'WelcomeToYourGalaxy/conflict-feed';
const BRANCH = 'main';
const ENDPOINTS = [
    () => 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/wire_conflict.json?t=' + Date.now(),
    () => 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + BRANCH + '/wire_conflict.json'
];

// Earth tones: moss, sage, clay, slate, mauve, taupe. Nothing neon, and
// nothing in the orange or yellow band.
const TOPIC_COLOR = {
    offensive: '#b58080',      // deep clay
    strikes: '#c08a86',        // clay
    civilians: '#c4a6a2',      // dusty rose
    arms: '#8ea2b8',           // slate blue
    money: '#a9a49a',          // taupe
    bases: '#93a3c0',          // dusty blue
    command: '#a496b8',        // muted violet
    law: '#a8b79a',            // sage
    nuclear: '#b193a8',        // mauve
    humanitarian: '#86a5a5',   // weathered teal
    cyber: '#9bb08a'           // moss
};
const STANDING_COLOR = {
    official: '#93a3c0', research: '#a8b79a', trade: '#8ea2b8', press: '#a49f98'
};
const KIND_COLOR = { escalation: '#c08a86', deescalation: '#a8b79a' };
const WINDOWS = [
    { id: 'd1', label: '24 hours', ms: 864e5 },
    { id: 'd7', label: '7 days', ms: 7 * 864e5 },
    { id: 'd30', label: '30 days', ms: 30 * 864e5 },
    // the wire keeps 45 days, so anything past a month is reachable on its own
    { id: 'older', label: 'Older than 30 days', ms: 30 * 864e5, older: true },
    { id: 'all', label: 'Everything', ms: null }
];

const EVIDENCE = [
    { id: 'all', label: 'All stories' },
    { id: 'doc', label: 'Well-documented only' }
];

/* ============================================================
   Translation. Two independent things, because one of them can
   fail and the other cannot:

   1. In-place machine translation of the headlines and snippets
      you are looking at, through a free public endpoint. No key,
      no account. If it is unavailable the row falls back to the
      original text and says so rather than showing nothing.
   2. A per-row link that opens the article itself translated,
      which is a plain URL and works even when (1) does not.

   Machine translation is never presented as the publisher's own
   words: a translated row is marked, and the original title is
   kept on hover.
   ============================================================ */
const TR_LANGS = [
    ['off', 'Off — original'], ['en', 'English'], ['es', 'Español'], ['pt', 'Português'],
    ['fr', 'Français'], ['de', 'Deutsch'], ['it', 'Italiano'], ['nl', 'Nederlands'],
    ['sv', 'Svenska'], ['pl', 'Polski'], ['el', 'Ελληνικά'], ['ru', 'Русский'],
    ['uk', 'Українська'], ['tr', 'Türkçe'], ['ar', 'العربية'], ['he', 'עברית'],
    ['fa', 'فارسی'], ['hi', 'हिन्दी'], ['bn', 'বাংলা'], ['id', 'Bahasa Indonesia'],
    ['vi', 'Tiếng Việt'], ['th', 'ไทย'], ['ja', '日本語'], ['zh-CN', '简体中文'],
    ['zh-TW', '繁體中文'], ['ko', '한국어'], ['sw', 'Kiswahili']
];
const trCache = new Map();        // key: lang + '\u0000' + text
let trPending = false;

function trKey(lang, text) { return lang + '\u0000' + text; }

async function trOne(text, lang) {
    const endpoints = [
        () => 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
              lang + '&dt=t&q=' + encodeURIComponent(text),
        () => 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
              '&langpair=autodetect|' + lang
    ];
    for (let i = 0; i < endpoints.length; i++) {
        try {
            const res = await fetch(endpoints[i]());
            if (!res.ok) continue;
            const data = await res.json();
            if (i === 0 && Array.isArray(data) && Array.isArray(data[0])) {
                const out = data[0].map(seg => (seg && seg[0]) || '').join('');
                if (out.trim()) return out;
            }
            if (i === 1 && data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (e) { /* try the next one */ }
    }
    return null;
}

async function trFill(items, lang, onDone) {
    // only what is on screen, and only what is not already cached
    const wanted = [];
    items.forEach(i => {
        [i.title, i.snippet].forEach(t => {
            if (t && !trCache.has(trKey(lang, t))) wanted.push(t);
        });
    });
    if (!wanted.length) { onDone(false); return; }

    trPending = true;
    let changed = false;
    const queue = wanted.slice(0, 120);
    async function worker() {
        while (queue.length) {
            const text = queue.shift();
            const out = await trOne(text, lang);
            trCache.set(trKey(lang, text), out || text);   // fall back to the original
            changed = true;
        }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    trPending = false;
    onDone(changed);
}

function trText(text, lang) {
    if (!text || lang === 'off') return text;
    const hit = trCache.get(trKey(lang, text));
    return hit === undefined ? text : hit;
}

/* the article itself, translated, as a plain link */
function trUrl(url, lang) {
    try {
        const u = new URL(url);
        return 'https://translate.google.com/translate?sl=auto&tl=' + lang +
               '&u=' + encodeURIComponent(u.href);
    } catch (e) { return url; }
}

const state = { tl: 'off', items: [], topics: [], languages: {}, sources: [], generated: null,
                geo: [], standings: [], kinds: [], docScore: 3, topic: 'all', standing: 'all',
                place: 'all', sub: 'all', spot: 'all', kind: 'all', langs: new Set(),
                when: 'all', evidence: 'all', query: '', shown: 50, loading: false };

const $list = document.getElementById('cfList');
const $status = document.getElementById('cfStatus');
const $dot = document.getElementById('cfDot');
const $prog = document.getElementById('cfProgress');
const $topicRow = document.getElementById('cfTopicRow');
const $standingRow = document.getElementById('cfRegionRow');
const $evidenceRow = document.getElementById('cfEvidenceRow');
const $kindRow = document.getElementById('cfKindRow');
const $geoRow = document.getElementById('cfGeoRow');
const $subRow = document.getElementById('cfSubRow');
const $placeRow = document.getElementById('cfPlaceRow');
const $langRow = document.getElementById('cfLangRow');
const $whenRow = document.getElementById('cfWhenRow');
const $search = document.getElementById('cfSearch');
const $srcGrid = document.getElementById('cfSrcGrid');
const $refresh = document.getElementById('cfRefresh');
const $more = document.createElement('button');
$more.className = 'cf-more';
$more.addEventListener('click', () => {
    state.shown += 50;
    render();
    if (state.tl !== 'off') {
        const more = visible().slice(0, state.shown);
        trFill(more, state.tl, () => { render(); refreshStatus(); });
    }
});

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function timeAgo(ts) {
    if (!ts) return 'undated';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.round(h / 24);
    return d < 30 ? d + 'd ago' : new Date(ts).toISOString().slice(0, 10);
}
function langName(c) { return state.languages[c] || c; }
function placeLabel(item) {
    // a named city, province or base if the harvest found one, then the place,
    // the subregion, the region
    if (item.pin) return item.pin;
    const spots = (item.spots || []).filter(p => p !== 'unlocated');
    const subs = (item.subs || []).filter(p => p !== 'unlocated');
    const regs = (item.places || []).filter(p => p !== 'unlocated');
    const lookup = (id) => {
        for (const r of state.geo) {
            if (r.id === id) return r.label;
            for (const sb of (r.subs || [])) {
                if (sb.id === id) return sb.label;
                for (const pl of (sb.places || [])) if (pl.id === id) return pl.label;
            }
        }
        return id;
    };
    const pick = spots.length ? spots : (subs.length ? subs : regs);
    if (!pick.length) return 'unplaced';
    return pick.slice(0, 2).map(lookup).join(' · ');
}
function topicLabel(id) { const t = state.topics.find(t => t.id === id); return t ? t.label : id; }
let lastStatus = '';
function placedNote() {
    /* How much of the wire the map can actually vouch for. A story pinned on a
       named town is a different claim from one dropped on a country's centre,
       and both differ from one the harvester could not locate at all — so the
       three are counted separately rather than rolled into a single figure. */
    const el = document.getElementById('cfPlaced');
    if (!el) return;
    const all = state.items || [];
    if (!all.length) { el.textContent = ''; return; }
    let town = 0, country = 0;
    all.forEach(i => { if (i.ll && i.pin) town++; else if (i.ll) country++; });
    const none = all.length - town - country;
    el.innerHTML = 'Pins: <b>' + town + '</b> on a named place · <b>' + country +
                   '</b> on a country only · <b>' + none + '</b> not located.';
}

function refreshStatus() { if (lastStatus) $status.textContent = lastStatus; }
function setStatus(text, cls) { $status.textContent = text;
    if (text.indexOf('Translating') === -1) lastStatus = text; $dot.className = 'cf-dot' + (cls ? ' ' + cls : ''); }

async function load() {
    if (state.loading) return;
    state.loading = true; $refresh.disabled = true; $prog.style.width = '40%';
    setStatus('Loading the wire…', '');

    let data = null, err = null;
    for (const ep of ENDPOINTS) {
        try {
            const res = await fetch(ep(), { cache: 'no-store' });
            if (!res.ok) { err = 'HTTP ' + res.status; continue; }
            data = await res.json(); break;
        } catch (e) { err = e.message; }
    }
    $prog.style.width = '100%';

    if (!data || !Array.isArray(data.items)) {
        state.loading = false; $refresh.disabled = false; $prog.style.width = '0';
        setStatus('The wire could not be read' + (err ? ' (' + err + ')' : '') + '. Press Refresh.', 'error');
        render(); return;
    }

    state.items = data.items.map(i => ({
        title: i.t, link: i.u, outlet: i.o, lang: i.g, region: i.r,
        kind: i.k, ts: i.d, snippet: i.s, topics: i.x || ['climate'],
        score: i.p || 0, why: i.y || [], places: i.w || ['unlocated'],
        standing: i.st || 'press', kinds: i.k || ['escalation'],
        subs: i.sr || ['unlocated'], spots: i.pl || ['unlocated'],
        ll: (i.ll && i.ll.length === 2) ? i.ll : null, pa: !!i.pa, pin: i.pn || null
    }));
    state.docScore = data.notable_score || 3;
    state.standings = data.standings || [];
    state.kindList = data.kinds || [];
    state.coords = data.coords || {};
    state.topics = data.topics || [];
    state.languages = data.languages || {};
    state.geo = data.geo || [];
    state.sources = data.sources || [];
    state.generated = data.generated ? Date.parse(data.generated) : null;

    buildChips(); renderSources();

    const c = data.counts || {};
    const ageH = state.generated ? (Date.now() - state.generated) / 3600000 : null;
    const docd = state.items.filter(i => i.score >= state.docScore).length;
    const mappable = state.items.filter(i => i.ll).length;
    setStatus(
        (c.stories || state.items.length) + ' stories · ' +
        mappable + ' placed on the map · ' + docd + ' well-documented · ' + (c.too_local ? c.too_local + ' too local · ' : '') +
        (c.refused ? c.refused + ' refused · ' : '') +
        (c.languages || new Set(state.items.map(i => i.lang)).size) + ' languages · ' +
        (c.wires_ok || '?') + '/' + (c.wires_total || '?') + ' wires answered · harvested ' +
        (state.generated ? timeAgo(state.generated) : 'unknown'),
        ageH !== null && ageH > 6 ? 'idle' : ''
    );

    state.loading = false; $refresh.disabled = false;
    setTimeout(() => { $prog.style.width = '0'; }, 400);
    render();
}

function withinWindow(i, win) {
    const w = WINDOWS.find(w => w.id === (win || state.when));
    if (!w || !w.ms) return true;
    if (!i.ts) return false;
    const age = Date.now() - i.ts;
    return w.older ? age > w.ms : age <= w.ms;
}

function visible() {
    const q = state.query.toLowerCase();
    return state.items.filter(i => {
        if (state.topic !== 'all' && i.topics.indexOf(state.topic) === -1) return false;
        if (state.standing !== 'all' && i.standing !== state.standing) return false;
        if (state.kind !== 'all' && i.kinds.indexOf(state.kind) === -1) return false;
        if (state.evidence === 'doc' && i.score < state.docScore) return false;
        if (state.place !== 'all' && i.places.indexOf(state.place) === -1) return false;
        if (state.sub !== 'all' && i.subs.indexOf(state.sub) === -1) return false;
        if (state.spot !== 'all' && i.spots.indexOf(state.spot) === -1) return false;
        if (state.langs.size && !state.langs.has(i.lang)) return false;
        if (!withinWindow(i)) return false;
        if (q && (i.title + ' ' + i.snippet + ' ' + i.outlet).toLowerCase().indexOf(q) === -1) return false;
        return true;
    }).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

function render() {
    placedNote();
    const items = visible(), slice = items.slice(0, state.shown);
    if (!slice.length) {
        $list.innerHTML = '<div class="cf-state">' + (
            state.loading ? 'Loading the wire…'
            : state.items.length ? '<strong>Nothing matches these filters.</strong><br>Widen the window, the subject or the language.'
            : '<strong>No stories loaded.</strong><br>Press Refresh, or check that the harvester has run.'
        ) + '</div>';
    } else {
        $list.innerHTML = slice.map(i => {
            const tags = i.topics.map(id => {
                const c = TOPIC_COLOR[id] || '#a49f98';
                return '<span class="cf-t" style="color:' + c + ';border-color:' + c + '55">' + esc(topicLabel(id)) + '</span>';
            }).join('');
            const documented = i.score >= state.docScore;
            const sc = STANDING_COLOR[i.standing] || '#a49f98';
            const stLabel = (state.standings.find(s => s.id === i.standing) || {}).label || i.standing;
            const pips = '<span class="cf-scale" title="evidence score ' + i.score + '">' +
                [1,2,3,4,5].map(n => '<span class="cf-pip' + (n <= Math.min(i.score,5) ? ' on' : '') + '"></span>').join('') +
                '</span>';
            return '<a class="cf-item' + (documented ? ' watch' : '') + '" href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer">' +
                '<div class="cf-meta"><span class="cf-lang">' + esc(langName(i.lang)) + '</span>' +
                '<span class="cf-standing" style="color:' + sc + ';border-color:' + sc + '55">' + esc(stLabel) + '</span>' +
                i.kinds.map(k => {
                    const kc = KIND_COLOR[k] || '#a49f98';
                    const kl = (state.kindList.find(x => x.id === k) || {}).label || k;
                    return '<span class="cf-standing" style="color:' + kc + ';border-color:' + kc + '55">' + esc(kl) + '</span>';
                }).join('') +
                '<span>' + esc(i.outlet) + '</span>' +
                '<span>' + esc(placeLabel(i)) + '</span>' +
                pips + (i.why.length ? '<span class="cf-why">' + esc(i.why.join(' · ')) + '</span>' : '') +
                '<span>' + timeAgo(i.ts) + '</span>' +
                (state.tl !== 'off' ? '<span class="cf-mt">machine translation</span>' : '') +
                '</div>' +
                '<div class="cf-item-title"' + (state.tl !== 'off' ? ' title="' + esc(i.title) + '"' : '') + '>' + esc(trText(i.title, state.tl)) + '</div>' +
                (i.snippet ? '<div class="cf-snip">' + esc(trText(i.snippet, state.tl)) + '</div>' : '') +
                '<div class="cf-tags">' + tags + '</div></a>';
        }).join('');
        if (items.length > state.shown) {
            $more.textContent = 'Show more (' + (items.length - state.shown) + ' remaining)';
            $list.appendChild($more);
        } else {
            // the list scrolls inside its own box, so mark where the bottom is
            const end = document.createElement('div');
            end.className = 'cf-state';
            end.style.padding = '0.7rem';
            end.style.fontSize = '0.62rem';
            end.textContent = 'End of ' + items.length + ' ' + (items.length === 1 ? 'story' : 'stories');
            $list.appendChild(end);
        }
    }
    chipCounts();
    renderMap(items);
}

function chip(row, key, value, label, color) {
    const c = document.createElement('button');
    c.className = 'cf-chip';
    c.dataset[key] = value;
    if (color) c.style.setProperty('--chipcolor', color);
    c.innerHTML = esc(label) + ' <span class="cf-n"></span>';
    row.appendChild(c);
    return c;
}

function buildChips() {
    [$topicRow, $geoRow, $standingRow, $kindRow, $evidenceRow, $langRow, $whenRow].forEach(r => r.querySelectorAll('.cf-chip').forEach(c => c.remove()));

    chip($topicRow, 'topic', 'all', 'All').classList.add('on');
    state.topics.forEach(t => chip($topicRow, 'topic', t.id, t.label, TOPIC_COLOR[t.id]));

    chip($geoRow, 'place', 'all', 'Everywhere').classList.add('on');
    state.geo.forEach(g => {
        const c = chip($geoRow, 'place', g.id, g.label);
        if (g.id === state.place) c.classList.add('on');
    });
    buildDrilldown();

    chip($standingRow, 'standing', 'all', 'All').classList.add('on');
    state.standings.forEach(st => {
        const c = chip($standingRow, 'standing', st.id, st.label);
        c.style.setProperty('--chipcolor', STANDING_COLOR[st.id] || '#d8d5cd');
        if (st.id === state.standing) c.classList.add('on');
    });

    chip($kindRow, 'kind', 'all', 'Both').classList.add('on');
    (state.kindList || []).forEach(k => {
        const c = chip($kindRow, 'kind', k.id, k.label);
        c.style.setProperty('--chipcolor', KIND_COLOR[k.id] || '#d8d5cd');
        if (k.id === state.kind) c.classList.add('on');
    });

    EVIDENCE.forEach(e => {
        const c = chip($evidenceRow, 'evidence', e.id, e.label);
        if (e.id === state.evidence) c.classList.add('on');
    });

    // an explicit All chip: without one the only way back from a single
    // language was to untick it again
    const allLang = chip($langRow, 'lang', 'all', 'All languages');
    if (!state.langs.size) allLang.classList.add('on');
    Object.keys(state.languages).sort((a, b) => langName(a).localeCompare(langName(b)))
        .forEach(code => chip($langRow, 'lang', code, langName(code)));

    WINDOWS.forEach(w => {
        const c = chip($whenRow, 'when', w.id, w.label);
        if (w.id === state.when) c.classList.add('on');
    });

}

function buildDrilldown() {
    [$subRow, $placeRow].forEach(r => r.querySelectorAll('.cf-chip').forEach(c => c.remove()));
    const region = state.geo.find(g => g.id === state.place);
    if (!region || !region.subs || !region.subs.length) {
        $subRow.style.display = 'none';
        $placeRow.style.display = 'none';
        state.sub = 'all'; state.spot = 'all';
        return;
    }
    $subRow.style.display = '';
    const allSub = chip($subRow, 'sub', 'all', 'All of ' + region.label);
    if (state.sub === 'all') allSub.classList.add('on');
    region.subs.forEach(sb => {
        const c = chip($subRow, 'sub', sb.id, sb.label);
        if (sb.id === state.sub) c.classList.add('on');
    });

    const sub = region.subs.find(sb => sb.id === state.sub);
    if (!sub || !sub.places || !sub.places.length) {
        $placeRow.style.display = 'none';
        state.spot = 'all';
        return;
    }
    $placeRow.style.display = '';
    const allSpot = chip($placeRow, 'spot', 'all', 'All of ' + sub.label);
    if (state.spot === 'all') allSpot.classList.add('on');
    sub.places.forEach(pl => {
        const c = chip($placeRow, 'spot', pl.id, pl.label);
        if (pl.id === state.spot) c.classList.add('on');
    });
}

function chipCounts() {
    const q = state.query.toLowerCase();
    const base = state.items.filter(i =>
        (!q || (i.title + ' ' + i.snippet).toLowerCase().indexOf(q) !== -1) && withinWindow(i));
    $topicRow.querySelectorAll('.cf-chip').forEach(c => {
        const id = c.dataset.topic;
        const n = id === 'all' ? base.length : base.filter(i => i.topics.indexOf(id) !== -1).length;
        c.querySelector('.cf-n').textContent = n;
        c.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $subRow.querySelectorAll('.cf-chip').forEach(c => {
        const id = c.dataset.sub;
        const n = id === 'all'
            ? base.filter(i => state.place === 'all' || i.places.indexOf(state.place) !== -1).length
            : base.filter(i => i.subs.indexOf(id) !== -1).length;
        c.querySelector('.cf-n').textContent = n;
        c.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $placeRow.querySelectorAll('.cf-chip').forEach(c => {
        const id = c.dataset.spot;
        const n = id === 'all'
            ? base.filter(i => state.sub === 'all' || i.subs.indexOf(state.sub) !== -1).length
            : base.filter(i => i.spots.indexOf(id) !== -1).length;
        c.querySelector('.cf-n').textContent = n;
        c.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $geoRow.querySelectorAll('.cf-chip').forEach(c => {
        const g = c.dataset.place;
        const n = g === 'all' ? base.length : base.filter(i => i.places.indexOf(g) !== -1).length;
        c.querySelector('.cf-n').textContent = n;
        c.classList.toggle('empty', n === 0 && g !== 'all');
    });
    $standingRow.querySelectorAll('.cf-chip').forEach(c => {
        const r = c.dataset.standing;
        const n = r === 'all' ? base.length : base.filter(i => i.standing === r).length;
        c.querySelector('.cf-n').textContent = n;
        c.classList.toggle('empty', n === 0 && r !== 'all');
    });
    $kindRow.querySelectorAll('.cf-chip').forEach(c => {
        const k = c.dataset.kind;
        const n = k === 'all' ? base.length : base.filter(i => i.kinds.indexOf(k) !== -1).length;
        c.querySelector('.cf-n').textContent = n;
        c.classList.toggle('empty', n === 0 && k !== 'all');
    });
    $evidenceRow.querySelectorAll('.cf-chip').forEach(c => {
        const id = c.dataset.evidence;
        c.querySelector('.cf-n').textContent =
            id === 'doc' ? base.filter(i => i.score >= state.docScore).length : base.length;
    });
    $langRow.querySelectorAll('.cf-chip').forEach(c => {
        const code = c.dataset.lang;
        const n = code === 'all' ? base.length : base.filter(i => i.lang === code).length;
        c.querySelector('.cf-n').textContent = n;
        c.classList.toggle('empty', n === 0 && code !== 'all');
    });
    $whenRow.querySelectorAll('.cf-chip').forEach(c => {
        const n = state.items.filter(i => withinWindow(i, c.dataset.when)).length;
        c.querySelector('.cf-n').textContent = n;
        // the archive chip only appears once there is an archive
        if (c.dataset.when === 'older') c.style.display = n ? '' : 'none';
    });
}

function renderSources() {
    $srcGrid.innerHTML = state.sources.map(s =>
        '<div class="cf-src ' + (s.ok ? '' : 'fail') + '"><span>' + esc(s.name) + '</span>' +
        '<span>' + (s.ok ? s.kept + ' kept' + (s.small ? ' · ' + s.small + ' too local' : '') +
            (s.refused ? ' · ' + s.refused + ' refused' : '') : 'unreachable') +
        '</span></div>').join('');
}

/* ============================================================
   GUERILLAMAP COMPANION

   A cross-origin iframe cannot be read from this page — no DOM access, no
   pulling their layers out. What it can be is DRIVEN: their app takes its
   whole state from the query string, so this rebuilds the src to match
   wherever this map is looking. One-way, this map to theirs.

   Rebuilding the src reloads the frame, which makes their app re-fetch, so
   the update is held until the pan or zoom has been still for a moment and
   is skipped entirely when the view has not actually changed. Follow can be
   switched off to pin their view while this one keeps moving.

   Nothing here touches the map itself. The panel is a sibling element, not
   a Leaflet layer or pane, so the plate and the satellite treatment are
   untouched by it — opening and closing only changes the map container's
   height, which is why invalidateSize and the redraws are called after.
   ============================================================ */
const GM_HOME = 'https://guerillamap.com/';
const GM_GRID = '-0.35,0.5,10,10,null,null';
const GM_BASEMAP = 'esri-aerial-layer';
/* Their panel is shorter and wider than this map, so handing it the same
   centre puts the ground higher in their frame than in ours. This drops their
   centre south by a share of their own frame height — a proportion, not a
   fixed number of degrees, so it stays the same on screen at every zoom.
   Tune it live with gmShift(0.3); gmShift(0) turns it off. */
let GM_SHIFT = 0.22;

const GM_OVERLAYS = [
    'feature_group_geoNews', 'feature_group_geoNewsHist', 'feature_group_conflicts',
    'feature_group_activity', 'feature_group_losses', 'feature_group_nuctests',
    'feature_group_minefields', 'feature_group_uyghurs', 'feature_group_terror',
    'feature_group_UserMap', 'feature_group_migration_routes',
    'feature_group_strong_borders', 'feature_group_borders'
].join(',');

let gmOpen = true, gmTimer = null, gmLast = '';

function gmUrl() {
    let lat = 20, lon = 10, z = 3;
    try {
        const c = cfMap.getCenter();
        lat = c.lat; lon = c.lng;
        z = Math.max(2, Math.min(18, Math.round(cfMap.getZoom())));
    } catch (e) { /* map not ready; the defaults stand */ }
    // drop south by GM_SHIFT of their frame height. Web Mercator: a pixel is
    // (360 / 256·2^z) degrees of longitude, and that many degrees of latitude
    // narrowed by cos(lat).
    try {
        const f = document.getElementById('cfGmFrame');
        const hpx = (f && f.clientHeight) || 260;
        const degPerPx = (360 / (256 * Math.pow(2, z))) * Math.cos(lat * Math.PI / 180);
        lat = Math.max(-78, Math.min(82, lat - GM_SHIFT * hpx * degPerPx));
    } catch (e) { /* no frame yet; centre as-is */ }

    // their app reads a bare lat,lng pair and an integer zoom
    return GM_HOME + '?coords=' + encodeURIComponent(lat.toFixed(5) + ',' + lon.toFixed(5)) +
           '&zoom=' + z +
           '&grid=' + encodeURIComponent(GM_GRID) +
           '&basemap=' + GM_BASEMAP +
           '&overlays=' + encodeURIComponent(GM_OVERLAYS);
}

window.gmShift = v => { if (v != null) GM_SHIFT = v; gmSync(true); return GM_SHIFT; };

function gmSync(force) {
    if (!gmOpen) return;
    const follow = document.getElementById('cfGmSync');
    if (!force && !(follow && follow.checked)) return;
    const url = gmUrl();
    if (url === gmLast) return;                 // same view: do not reload them for nothing
    gmLast = url;
    const f = document.getElementById('cfGmFrame');
    const out = document.getElementById('cfGmOut');
    const wait = document.getElementById('cfGmWait');
    if (out) out.href = url;
    if (!f) return;
    if (wait) wait.hidden = false;
    f.addEventListener('load', () => { if (wait) wait.hidden = true; }, { once: true });
    // wait a frame: assigning src before the panel has been laid out can leave
    // their app measuring a zero-height box and drawing nothing into it
    requestAnimationFrame(() => { f.src = url; });
}

function gmQueue() {
    clearTimeout(gmTimer);
    gmTimer = setTimeout(gmSync, 900);          // wait until the gesture has settled
}

function gmToggle(on) {
    gmOpen = on;
    const panel = document.getElementById('cfGm');
    const btn = document.getElementById('cfGmOpen');
    const wrap = document.getElementById('cfMapWrap');
    if (panel) panel.hidden = !on;
    if (wrap) wrap.classList.toggle('gm-open', on);
    if (btn) { btn.textContent = on ? '– overlays' : '+ overlays'; btn.classList.toggle('on', on); }
    if (on) gmSync(true);
    // the map container just changed height: let Leaflet remeasure, then put
    // the screen-anchored fills, the plate and the pins back where they belong
    setTimeout(() => {
        try {
            if (!cfMap) return;
            cfMap.invalidateSize();
            cfMap.fire('move');
            resizePins();
        } catch (e) { /* map not up */ }
    }, 60);
}

/* ---- Wiring ---- */
function single(row, key) {
    row.addEventListener('click', e => {
        const c = e.target.closest('.cf-chip'); if (!c) return;
        state[key] = c.dataset[key]; state.shown = 50;
        row.querySelectorAll('.cf-chip').forEach(x => x.classList.toggle('on', x === c));
        render();
    });
}
single($topicRow, 'topic');
single($standingRow, 'standing');
single($evidenceRow, 'evidence');
single($kindRow, 'kind');
$geoRow.addEventListener('click', e => {
    const c = e.target.closest('.cf-chip'); if (!c) return;
    state.place = c.dataset.place; state.sub = 'all'; state.spot = 'all'; state.shown = 50;
    $geoRow.querySelectorAll('.cf-chip').forEach(x => x.classList.toggle('on', x === c));
    buildDrilldown(); render(); fitToSelection();
});
$subRow.addEventListener('click', e => {
    const c = e.target.closest('.cf-chip'); if (!c) return;
    state.sub = c.dataset.sub; state.spot = 'all'; state.shown = 50;
    buildDrilldown(); render(); fitToSelection();
});
$placeRow.addEventListener('click', e => {
    const c = e.target.closest('.cf-chip'); if (!c) return;
    state.spot = c.dataset.spot; state.shown = 50;
    $placeRow.querySelectorAll('.cf-chip').forEach(x => x.classList.toggle('on', x === c));
    render(); fitToSelection();
});
single($whenRow, 'when');

$langRow.addEventListener('click', e => {
    const c = e.target.closest('.cf-chip'); if (!c) return;
    const code = c.dataset.lang;
    if (code === 'all') {
        state.langs.clear();
    } else if (state.langs.has(code)) {
        state.langs.delete(code);
    } else {
        state.langs.add(code);
    }
    // All is lit exactly when no single language is picked
    $langRow.querySelectorAll('.cf-chip').forEach(x => x.classList.toggle('on',
        x.dataset.lang === 'all' ? !state.langs.size : state.langs.has(x.dataset.lang)));
    state.shown = 50; render();
});

$refresh.addEventListener('click', load);
// if the wire never arrives the map never initialises, and the panel would sit
// on "Loading" for ever. Load it from the default view instead.
setTimeout(() => { if (gmOpen && !gmLast) gmSync(true); }, 1500);

const gmOpenBtn = document.getElementById('cfGmOpen');
if (gmOpenBtn) gmOpenBtn.addEventListener('click', () => gmToggle(!gmOpen));
const gmCloseBtn = document.getElementById('cfGmClose');
if (gmCloseBtn) gmCloseBtn.addEventListener('click', () => gmToggle(false));
const gmFollow = document.getElementById('cfGmSync');
if (gmFollow) gmFollow.addEventListener('change', () => { if (gmFollow.checked) gmSync(true); });

document.getElementById('cfClear').addEventListener('click', () => {
    state.topic = 'all'; state.standing = 'all'; state.evidence = 'all'; state.place = 'all';
    state.kind = 'all'; state.sub = 'all'; state.spot = 'all';
    state.langs.clear(); state.when = 'all';
    state.query = ''; state.shown = 50; $search.value = '';
    $topicRow.querySelectorAll('.cf-chip').forEach(c => c.classList.toggle('on', c.dataset.topic === 'all'));
    $standingRow.querySelectorAll('.cf-chip').forEach(c => c.classList.toggle('on', c.dataset.standing === 'all'));
    $evidenceRow.querySelectorAll('.cf-chip').forEach(c => c.classList.toggle('on', c.dataset.evidence === 'all'));
    $kindRow.querySelectorAll('.cf-chip').forEach(c => c.classList.toggle('on', c.dataset.kind === 'all'));
    $geoRow.querySelectorAll('.cf-chip').forEach(c => c.classList.toggle('on', c.dataset.place === 'all'));
    buildDrilldown(); fitToSelection();
    $langRow.querySelectorAll('.cf-chip').forEach(c => c.classList.toggle('on', c.dataset.lang === 'all'));
    $whenRow.querySelectorAll('.cf-chip').forEach(c => c.classList.toggle('on', c.dataset.when === 'all'));
    render();
});
let timer;
$search.addEventListener('input', e => {
    clearTimeout(timer); const v = e.target.value;
    timer = setTimeout(() => { state.query = v; state.shown = 50; render(); }, 180);
});

document.querySelectorAll('.cf-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        const sheet = document.getElementById(tab.dataset.sheet);
        const opening = !sheet.classList.contains('open');
        document.querySelectorAll('.cf-sheet').forEach(s => s.classList.remove('open'));
        document.querySelectorAll('.cf-tab').forEach(t => t.classList.remove('on'));
        if (opening) { sheet.classList.add('open'); tab.classList.add('on'); }
    });
});
document.querySelectorAll('.cf-sheet [data-close]').forEach(b => {
    b.addEventListener('click', () => {
        b.closest('.cf-sheet').classList.remove('open');
        document.querySelectorAll('.cf-tab').forEach(t => t.classList.remove('on'));
    });
});
document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.cf-sheet').forEach(s => s.classList.remove('open'));
    document.querySelectorAll('.cf-tab').forEach(t => t.classList.remove('on'));
});


/* ============================================================
   The map. Satellite imagery from Esri's free World Imagery layer —
   no key, no account. Every story that resolved to a place is drawn
   at that place, and the pins obey the filters exactly as the list
   does, because they are built from the same visible() call.
   ============================================================ */
let cfMap = null, cfLayer = null, mapBroken = false, cfPins = [];

function initMap() {
    if (cfMap || typeof L === 'undefined' || mapBroken) return;
    const el = document.getElementById('cfMap');
    if (!el) return;
    cfMap = L.map(el, { worldCopyJump: true, zoomControl: true, attributionControl: true })
             .setView([20, 10], 1);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16,
        noWrap: true,
        bounds: [[-85.05, -180], [85.05, 180]],
        updateWhenZooming: false,
        keepBuffer: 2,
        attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
    }).addTo(cfMap);
    cfLayer = L.layerGroup().addTo(cfMap);
    dressSatellite();
    setTimeout(() => cfMap.invalidateSize(), 60);
    window.addEventListener('resize', () => cfMap.invalidateSize());
    try {
        cfMap.on('moveend zoomend', gmQueue);
        gmSync(true);                  // the panel opens with the map's own view
    } catch (e) { console.warn('map: overlay companion not wired:', e); }
}

/* ============================================================
   The satellite treatment, carried over from the projects map.

   Photographic satellite imagery reads as a photograph: its colour is
   carried by hue, its usefulness — coastlines, terrain shape, where the
   trees stop — by luminance. So the imagery stays exactly where it is and
   supplies the light, a wash shifts the colour, and a hillshade puts the
   sculpting back. Every coastline on screen is still Esri's; nothing is
   redrawn.

   Five layers, bottom to top: imagery (filtered), a sea screen, a green

const SAT = {
    sat: 1.15,    // above 1, so surfaces stay different from each other
    con: 1.05,
    bright: 1.06,
    hue: -6,      // degrees, warms the greens off satellite's blue-green
    green: 0.30,  // soft-light green over land: tints without flattening
    warm: 0.22,   // overlay gold: the sunlit look
    sea: 0.55,
    shade: 0.45   // relief: the sculpted part
};
let satFills = [], satParts = [];

function dressSatellite() {
    if (!cfMap || typeof L === 'undefined') return;
    try {
        const pane = (name, z, blend) => {
            if (!cfMap.getPane(name)) cfMap.createPane(name);
            const el = cfMap.getPane(name);
            el.style.zIndex = z;
            el.style.pointerEvents = 'none';
            if (blend) el.style.mixBlendMode = blend;
            return el;
        };
        const fillPane = (name, z, blend, colour, opacity) => {
            const el = pane(name, z, blend);
            const d = document.createElement('div');
            d.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;background:' +
                              colour + ';opacity:' + opacity + ';';
            el.appendChild(d);
            satFills.push(d);
            satParts.push(el);
            return { el: el, fill: d };
        };

        // the imagery's own filter
        const sp = cfMap.getPane('tilePane');
        if (sp) sp.style.filter = 'saturate(' + SAT.sat + ') contrast(' + SAT.con +
            ') brightness(' + SAT.bright + ') hue-rotate(' + SAT.hue + 'deg)';

        // water first, under the land washes, so the sea is softened by them
        const seaL = fillPane('satSea', 205, 'screen', '#0f3b52', SAT.sea);
        // soft-light rather than color: it shifts hue in proportion to how light
        // a pixel already is, so ploughland goes green and dark rock stays dark
        const greenL = fillPane('satWash', 210, 'soft-light', '#5f8f3a', SAT.green);
        // overlay lifts highlights and deepens shadows at once — most of what
        // makes a map read as lit rather than scanned
        const warmL = fillPane('satWarm', 214, 'overlay', '#f0c073', SAT.warm);

        const shadeEl = pane('satShade', 220, 'multiply');
        satParts.push(shadeEl);
        const shade = L.tileLayer(
            'https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',
            { pane: 'satShade', opacity: SAT.shade, maxZoom: 16, maxNativeZoom: 16,
              noWrap: true, bounds: [[-85.05, -180], [85.05, 180]],
              updateWhenZooming: false, keepBuffer: 2, attribution: 'Hillshade © Esri' });

        // a layer that cannot load is dropped rather than left half-drawn
        const guard = (layer, name, onGone) => {
            let n = 0;
            layer.on('tileerror', () => {
                if (++n === 12) {
                    try { cfMap.removeLayer(layer); } catch (e) { /* already gone */ }
                    try { onGone && onGone(); } catch (e) { /* nothing to undo */ }
                    console.warn('map: ' + name + ' failed repeatedly; dropped');
                }
            });
            layer.addTo(cfMap);
        };
        guard(shade, 'hillshade', () => {
            // without relief the washes are just a colour cast on a photograph
            greenL.el.style.display = 'none';
            warmL.el.style.display = 'none';
            if (sp) sp.style.filter = '';
        });

        /* The painted plate. Below the fade window the map reads as a drawn
           chart; zoom past it and the plate cross-fades away to the imagery
           underneath. Purely decorative — interactive:false, so it never
           intercepts a click on a pin.
         *
         * The southern edge is the version from the social-spheres map. The
         * art here previously ended on a ruled horizontal line a little below
         * the compass rose: opaque ocean, hard seam, then nothing. The paint
         * below that line was still in the file — only its mask had been cut
         * square — so this carries the social-spheres alpha envelope across
         * the same rows, and the chart now thins out through the forties
         * instead of stopping at a straight edge. The title plaque keeps its
         * own mask, or it would take the other map's lettering with it. */
        const plateEl = pane('plate', 250);
        satParts.push(plateEl);
        const PLATE_S = -80.55, PLATE_N = 85.05112877980659;
        const PLATE_FADE_IN = 3, PLATE_FADE_OUT = 5.6;
        let plate = null;
        try {
            plate = L.imageOverlay(PLATE_IMG, [[PLATE_S, -180], [PLATE_N, 180]],
                { pane: 'plate', interactive: false }).addTo(cfMap);
        } catch (e) { console.warn('map: plate overlay unavailable:', e); }
        const blendPlate = () => {
            if (!plate) return;
            try {
                const z = cfMap.getZoom();
                const t = Math.max(0, Math.min(1, (z - PLATE_FADE_IN) / (PLATE_FADE_OUT - PLATE_FADE_IN)));
                const op = 1 - t;
                if (op <= 0.001) { if (cfMap.hasLayer(plate)) cfMap.removeLayer(plate); }
                else { if (!cfMap.hasLayer(plate)) plate.addTo(cfMap); plate.setOpacity(op); }
                el.classList.toggle('plated', op > 0.02);
            } catch (e) { /* not ready yet */ }
        };
        // zoomanim fires while the zoom is animating, so the plate dissolves
        // through the gesture rather than stepping at the end of it
        cfMap.on('zoomend zoomanim', blendPlate);
        cfMap.on('zoomend', resizePins);
        cfMap.whenReady(blendPlate);
        blendPlate();

        // A flat fill inside a Leaflet pane is nailed to the map, not the screen:
        // pan far enough and its edge crosses the view as a hard line. These
        // carry no geography, so they follow the screen instead — repositioned
        // against the map pane's own offset on every move.
        const cover = () => {
            try {
                const mp = cfMap.getPanes().mapPane;
                const o = L.DomUtil.getPosition(mp) || { x: 0, y: 0 };
                const sz = cfMap.getSize();
                const m = 400;
                satFills.forEach(d => {
                    d.style.left = (-o.x - m) + 'px';
                    d.style.top = (-o.y - m) + 'px';
                    d.style.width = (sz.x + m * 2) + 'px';
                    d.style.height = (sz.y + m * 2) + 'px';
                });
            } catch (e) { /* mid-gesture, next move fixes it */ }
        };

        // Tints ease off as you zoom in: wide out they do the work, close in
        // they cover the detail somebody zoomed in to see. Relief does the
        // reverse — it is wanted more at valley scale.
        const ramp = () => {
            try {
                const z = cfMap.getZoom();
                const t = z <= 6 ? 1 : z >= 13 ? 0.45 : 1 - (z - 6) * (0.55 / 7);
                greenL.fill.style.opacity = SAT.green * t;
                warmL.fill.style.opacity = SAT.warm * t;
                seaL.fill.style.opacity = SAT.sea * (z <= 6 ? 1 : 0.7);
                shade.setOpacity(z <= 4 ? SAT.shade * 0.8 : SAT.shade);
            } catch (e) { /* not ready yet */ }
        };
        cfMap.on('zoomend', ramp);
        cfMap.on('move zoom zoomend moveend resize viewreset', cover);
        cfMap.whenReady(() => { ramp(); cover(); });
        ramp(); cover();
    } catch (err) {
        console.warn('map: satellite treatment skipped:', err);
    }
}

function placeNameFor(item) {
    return placeLabel(item);
}

function renderMap(items) {
    try { renderMapInner(items); }
    catch (err) {
        // a broken map is a missing panel, never a missing feed
        mapBroken = true;
        const wrap = document.getElementById('cfMapWrap');
        if (wrap) wrap.style.display = 'none';
        console.warn('map disabled:', err);
    }
}

function renderMapInner(items) {
    if (typeof L === 'undefined' || mapBroken) {
        const wrap = document.getElementById('cfMapWrap');
        if (wrap) wrap.style.display = 'none';
        return;
    }
    initMap();
    if (!cfMap || !cfLayer) return;
    cfLayer.clearLayers();
    cfPins = [];

    // Every story gets its own pin. Stories resolving to the same place would
    // otherwise sit on top of each other, so each is nudged onto a ring around
    // the point — deterministic, so a pin does not move between renders.
    const seenAt = new Map();
    let mapped = 0, unplaced = 0, approx = 0;

    items.forEach(i => {
        if (!i.ll || i.ll.length !== 2) { unplaced++; return; }
        mapped++;
        if (i.pa) approx++;
        const key = i.ll[0] + ',' + i.ll[1];
        const n = seenAt.get(key) || 0;
        seenAt.set(key, n + 1);

        /* Where a story sits when others share its coordinate — see fanOffset. */
        const off = n > 0 ? fanOffset(n, i.link) : { dx: 0, dy: 0 };

        const entry = { item: i, at: i.ll.slice(), base: key, dx: off.dx, dy: off.dy,
                        colour: TOPIC_COLOR[i.topics[0]] || '#a49f98',
                        full: i.score >= state.docScore ? 13 : 10,
                        approx: !!i.pa,
                        dim: n > 0 ? 0.92 : 1 };
        entry.at = fanned(entry);
        const marker = L.marker(entry.at, { icon: pinIcon(entry), title: i.title }).addTo(cfLayer);
        entry.marker = marker;
        cfPins.push(entry);
        marker.on('click', () => openPinPopup(entry));
    });

    const c = document.getElementById('cfMapCount');
    const u = document.getElementById('cfMapUnplaced');
    if (c) c.textContent = mapped + (mapped === 1 ? ' story mapped' : ' stories mapped') +
        (approx ? ' \u00b7 ' + approx + ' by source country' : '');
    if (u) u.textContent = unplaced ? unplaced + ' unplaced' : '';
    state.mapped = mapped;
    state.unplaced = unplaced;
}

/* Choosing a geography moves the map to it. Only the geography rows do this —
   subject or direction filters leave the view where you put it, and panning is
   never overridden by a render. The frame comes from the gazetteer rather than
   from where the stories are, so an empty region still shows you the region. */
function pointsUnder(regionId, subId, spotId) {
    const co = state.coords || {};
    const out = [];
    const push = (id) => { if (co[id]) out.push(co[id]); };
    if (spotId && spotId !== 'all') { push(spotId); return out; }
    (state.geo || []).forEach(r => {
        if (regionId !== 'all' && r.id !== regionId) return;
        (r.subs || []).forEach(sb => {
            if (subId && subId !== 'all' && sb.id !== subId) return;
            (sb.places || []).forEach(pl => push(pl.id));
            if (!(sb.places || []).length) push(sb.id);
        });
        // the region's own centroid only if nothing beneath it was placeable,
        // otherwise it drags the frame away from the places it contains
        if (!out.length) push(r.id);
    });
    return out;
}

function fitToSelection() {
    if (!cfMap || mapBroken || typeof L === 'undefined') return;
    try {
        if (state.place === 'all') {
            cfMap.setView([20, 10], 1);
            return;
        }
        const pts = pointsUnder(state.place, state.sub, state.spot);
        if (!pts.length) return;
        if (pts.length === 1) {
            cfMap.setView(pts[0], state.spot !== 'all' ? 6 : 4);
            return;
        }
        cfMap.fitBounds(L.latLngBounds(pts), { padding: [24, 24], maxZoom: 7, animate: true });
    } catch (err) {
        console.warn('map could not frame the selection:', err);
    }
}

/* WHERE STACKED STORIES GO.
 *
 * Several stories a day name the same city, so their pins land on one
 * coordinate and only the top one is clickable. They have to be nudged apart,
 * and the first version did it on concentric rings at fixed angles: the result
 * read as a rosette — obviously drawn, obviously not where the news happened.
 *
 * This places them on a phyllotaxis spiral instead, the arrangement seeds take
 * on a sunflower head. Turning by the golden angle each time means no two
 * neighbours ever line up, so the eye finds no rings and no spokes; a hash of
 * the story's own URL then jitters the angle and the radius a little, which
 * breaks the spiral itself up. Same story, same jitter, every render.
 *
 * ACCURACY. The offsets are measured in SCREEN PIXELS and converted to degrees
 * against the current zoom, so a fan is a fixed size on screen and the
 * geographic error it introduces halves with every zoom step. Wide out the
 * spread is a few pixels wherever you are; by the time you are close enough to
 * read a city the pins have converged onto their true coordinates. The old
 * fixed 0.9-degree ring did the reverse — a hundred kilometres of error that
 * stayed a hundred kilometres however far you went in.
 */
const FAN_STEP = 8.5;                     // px between neighbours in a fan
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return (h >>> 0) / 4294967296;        // 0…1, stable for a given link
}

function fanOffset(n, link) {
    const j = hashSeed(link || String(n));
    const angle = n * GOLDEN_ANGLE + (j - 0.5) * 0.7;
    const r = FAN_STEP * Math.sqrt(n) * (0.85 + j * 0.3);
    return { dx: Math.cos(angle) * r, dy: Math.sin(angle) * r };
}

/* Pixels to degrees at the current zoom. Web Mercator: a degree of longitude
   is the same width everywhere, a degree of latitude narrows by cos(lat).
 *
 * The zoom used here has a floor. A pixel at zoom 1 is most of a degree, so a
 * screen-constant fan would throw pins a thousand kilometres off the city they
 * belong to — accurate on screen, nonsense on the ground. Below zoom 5 the fan
 * therefore keeps zoom 5's spacing, which caps the displacement at something
 * under two degrees and collapses the fan to a couple of pixels at world view:
 * a crowded city reads as one dot rather than a spray, which is both truer and
 * leaves the plate visible. Clicking that dot still opens every story on it. */
const FAN_ZOOM_FLOOR = 5;
function fanned(entry) {
    if (!entry.dx && !entry.dy) return entry.item.ll;
    let z = FAN_ZOOM_FLOOR;
    try { z = Math.max(FAN_ZOOM_FLOOR, cfMap.getZoom()); } catch (e) { /* not ready */ }
    const unit = 360 / (256 * Math.pow(2, z));
    const lat = entry.item.ll[0], lon = entry.item.ll[1];
    const cos = Math.max(0.2, Math.cos(lat * Math.PI / 180));
    return [lat + entry.dy * unit * cos, lon + entry.dx * unit];
}

/* Pin size follows the zoom. Wide out, where the painted plate is doing the
   work and a hundred stories can land in one country, full-size dots blot the
   chart out; close in there is room for them. So the dots shrink toward a
   third of their size at world view and come back up as you go in. The ring
   thins with them — a 2px black halo around a 6px dot is mostly halo. */
function pinScale() {
    let z = 3;
    try { z = cfMap.getZoom(); } catch (e) { /* not ready; assume mid */ }
    if (z <= 1) return 0.52;
    if (z >= 6) return 1;
    return 0.52 + (z - 1) * (0.48 / 5);
}

function pinIcon(entry) {
    const size = Math.max(5, Math.round(entry.full * pinScale()));
    const thin = size < 9 ? ' cf-pin-sm' : '';
    return L.divIcon({
        className: '',
        html: '<div class="cf-pin' + thin + (entry.approx ? ' cf-pin-approx' : '') + '" style="width:' + size + 'px;height:' + size +
              'px;background:' + entry.colour + ';color:' + entry.colour + ';opacity:' + entry.dim + ';"></div>',
        iconSize: [size, size], iconAnchor: [size / 2, size / 2]
    });
}

function resizePins() {
    try {
        cfPins.forEach(e => {
            e.marker.setIcon(pinIcon(e));
            if (e.dx || e.dy) {
                e.at = fanned(e);
                e.marker.setLatLng(e.at);
            }
        });
    } catch (err) { /* mid-render */ }
}

/* A pin rarely stands alone. Zoomed out, its neighbours sit within a few pixels
   of it and cannot be clicked apart, so clicking any of them opens everything
   within that radius — the clicked story first, the rest under it. */
const PIN_NEIGHBOUR_PX = 26;

function neighboursOf(entry) {
    const group = [entry];
    if (!cfMap) return group;
    let here;
    try { here = cfMap.latLngToContainerPoint(entry.at); }
    catch (e) { return group; }
    cfPins.forEach(other => {
        if (other === entry) return;
        if (other.base === entry.base) { group.push(other); return; }   // same place, always
        try {
            const p = cfMap.latLngToContainerPoint(other.at);
            const dx = p.x - here.x, dy = p.y - here.y;
            if (Math.sqrt(dx * dx + dy * dy) <= PIN_NEIGHBOUR_PX) group.push(other);
        } catch (e) { /* ignore an unplottable neighbour */ }
    });
    return group;
}

function openPinPopup(entry) {
    if (!cfMap) return;
    const group = neighboursOf(entry);
    const places = [];
    group.forEach(g => {
        const nm = placeLabel(g.item);
        if (places.indexOf(nm) === -1) places.push(nm);
    });
    const head = '<div class="cf-pop-place">' + esc(places.slice(0, 3).join(' · ')) +
                 (group.length > 1 ? ' · ' + group.length + ' stories here' : '') + '</div>';
    const rows = group.slice(0, 20).map((g, n) =>
        '<a href="' + esc(g.item.link) + '" target="_blank" rel="noopener noreferrer"' +
        (n === 0 && group.length > 1 ? ' class="cf-pop-first"' : '') + '>' +
        esc(trText(g.item.title, state.tl)) +
        '<span class="cf-pop-src">' + esc(g.item.source) +
        (places.length > 1 ? ' · ' + esc(placeLabel(g.item)) : '') + '</span></a>').join('');
    const more = group.length > 20 ? '<div class="cf-pop-place">and ' + (group.length - 20) + ' more</div>' : '';
    L.popup({ maxWidth: 300, autoPan: true })
     .setLatLng(entry.at)
     .setContent(head + rows + more)
     .openOn(cfMap);
}

/* translation control */
(function () {
    const sel = document.getElementById('cfTr');
    if (!sel) return;
    TR_LANGS.forEach(pair => {
        const o = document.createElement('option');
        o.value = pair[0]; o.textContent = pair[1];
        sel.appendChild(o);
    });
    sel.value = 'off';
    sel.addEventListener('change', () => {
        state.tl = sel.value;
        state.shown = 50;
        if (cfMap && !mapBroken) { try { cfMap.closePopup(); } catch (e) { /* no popup open */ } }
        render();
        if (state.tl === 'off') { refreshStatus(); return; }
        // the rows on screen, plus everything drawn on the map — a pin can carry
        // a story far below the visible slice of the list, and its popup should
        // read in the chosen language too
        const shown = visible();
        const wanted = shown.slice(0, state.shown);
        const seen = new Set(wanted.map(i => i.link));
        shown.forEach(i => {
            if (i.ll && !seen.has(i.link) && wanted.length < 220) {
                seen.add(i.link);
                wanted.push(i);
            }
        });
        setStatus('Translating ' + wanted.length + ' headlines…', '');
        trFill(wanted, state.tl, () => { render(); refreshStatus(); });
    });
})();

load();
setInterval(() => { if (!document.hidden) load(); }, 15 * 60 * 1000);
})();
