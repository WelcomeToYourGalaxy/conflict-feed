name: Harvest the conflict wire

on:
  schedule:
    - cron: "37 */2 * * *"     # every two hours, at :37
  workflow_dispatch:
  push:
    paths:
      - "harvest_conflict.py"
      - "sources_conflict.json"
      - ".github/workflows/harvest.yml"

permissions:
  contents: write

concurrency:
  group: harvest-conflict
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read every wire and write wire_conflict.json
        run: python3 harvest_conflict.py

      - name: Commit if the feed changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          WIRE="wire_conflict.json"
          cp "$WIRE" /tmp/harvested.json

          commit_wire() {
            cp /tmp/harvested.json "$WIRE"
            git add "$WIRE"
            if git diff --cached --quiet; then
              return 1
            fi
            COUNT=$(python3 -c "import json;d=json.load(open('wire_conflict.json'));c=d['counts'];print(str(c['stories'])+' stories, '+str(c['escalation'])+' escalation, '+str(c['deescalation'])+' de-escalation')")
            git commit -m "wire: $COUNT ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            return 0
          }

          if ! commit_wire; then
            echo "No change to $WIRE"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected — main moved. Taking the remote and re-applying the harvest (attempt $attempt)."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            commit_wire || { echo "Remote already has this wire"; exit 0; }
            sleep $((attempt * 5))
          done
          echo "Could not push after five attempts."
          exit 1
